<!-- @dsCard group="Patterns" name="CTA Banner" subtitle="Navy gradient with teal glow" viewport-width="960" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CTA Banner — Audcomp Design System</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "SF Pro Text", sans-serif; background: #fff; -webkit-font-smoothing: antialiased; }
  .cta { position: relative; overflow: hidden; padding: 96px 24px; text-align: center; background: linear-gradient(135deg,#071e3d 0%,#0d2d55 50%,#071e3d 100%); }
  .glow-teal { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; }
  .glow-teal div { width: 700px; height: 400px; border-radius: 9999px; opacity: 0.20; background: radial-gradient(ellipse, #06b6d4 0%, transparent 70%); }
  .glow-blue { position: absolute; top: 0; right: 25%; pointer-events: none; }
  .glow-blue div { width: 400px; height: 300px; border-radius: 9999px; opacity: 0.15; background: radial-gradient(ellipse, #0071e3 0%, transparent 70%); }
  .hr-top, .hr-bot { position: absolute; left: 0; right: 0; height: 1px; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.12), transparent); }
  .hr-top { top: 0; } .hr-bot { bottom: 0; }
  .inner { position: relative; max-width: 720px; margin: 0 auto; }
  .eyebrow { color: #06b6d4; text-transform: uppercase; letter-spacing: 0.12em; font-weight: 600; font-size: 12px; margin-bottom: 20px; }
  .title { font-family: "SF Pro Display", sans-serif; font-size: 56px; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 24px; line-height: 1.05;
           background: linear-gradient(180deg,#fff 0%,#a8c8e8 100%); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  .sub { color: rgba(255,255,255,0.55); font-size: 18px; line-height: 1.6; max-width: 520px; margin: 0 auto 48px; }
  .actions { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; }
  .btn { font-size: 14px; font-weight: 500; border-radius: 9999px; padding: 14px 32px; text-decoration: none; transition: all .2s; }
  .primary { background: #0071e3; color: #fff; }
  .primary:hover { background: #0077ed; }
  .outline { border: 1px solid rgba(255,255,255,0.25); color: rgba(255,255,255,0.75); }
  .outline:hover { color: #fff; border-color: rgba(255,255,255,0.5); }
</style>
</head>
<body>
  <section class="cta">
    <div class="glow-teal"><div></div></div>
    <div class="glow-blue"><div></div></div>
    <div class="hr-top"></div><div class="hr-bot"></div>
    <div class="inner">
      <p class="eyebrow">Get started today</p>
      <h2 class="title">Ready to get started?</h2>
      <p class="sub">Talk to our team about how Audcomp can help your business operate more efficiently and securely.</p>
      <div class="actions">
        <a class="btn primary">Contact Us</a>
        <a class="btn outline">905-304-1775</a>
      </div>
    </div>
  </section>
</body>
</html>
